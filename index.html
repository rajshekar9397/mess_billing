<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sri Karthikeya Deluxe Mess — Billing Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #faf7f2;
  --card: #ffffff;
  --accent: #c8511a;
  --accent2: #2d6a4f;
  --accent3: #1a3c6e;
  --text: #1c1c1c;
  --muted: #6b6b6b;
  --border: #e8e0d5;
  --egg: #f9a825;
  --veg: #388e3c;
  --chicken: #c62828;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
h1,h2,h3,.brand{font-family:'Playfair Display',serif;}

/* NAV */
nav{background:var(--accent3);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
nav .brand{font-size:1.2rem;letter-spacing:0.5px;flex:1;}
nav .sub{font-size:0.75rem;opacity:0.7;font-family:'DM Sans',sans-serif;}
nav button{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.82rem;transition:background 0.2s;}
nav button:hover,nav button.active{background:rgba(255,255,255,0.3);}

/* LAYOUT */
.container{max-width:1100px;margin:0 auto;padding:24px 16px;}
.page{display:none;} .page.active{display:block;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
@media(max-width:600px){.grid2{grid-template-columns:1fr;}}

/* STATS */
.stat{text-align:center;padding:16px;}
.stat .num{font-size:2rem;font-weight:700;font-family:'Playfair Display',serif;}
.stat .lbl{font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}
.stat.egg .num{color:var(--egg);}
.stat.veg .num{color:var(--veg);}
.stat.chicken .num{color:var(--chicken);}
.stat.total .num{color:var(--accent3);}

/* FORM */
label{display:block;font-size:0.82rem;font-weight:500;margin-bottom:4px;color:var(--muted);}
input,select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;background:var(--bg);color:var(--text);outline:none;}
input:focus,select:focus{border-color:var(--accent3);}
.btn{padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--accent3);color:#fff;}
.btn-primary:hover{background:#14305a;}
.btn-danger{background:#fee2e2;color:#c62828;border:1px solid #fca5a5;}
.btn-danger:hover{background:#fca5a5;}
.btn-sm{padding:5px 12px;font-size:0.8rem;}
.btn-print{background:var(--accent2);color:#fff;}
.btn-print:hover{background:#1a5c37;}

/* SECTION TITLE */
.section-title{font-size:1.1rem;margin-bottom:16px;color:var(--accent3);border-bottom:2px solid var(--border);padding-bottom:8px;}

/* TABLE */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:0.85rem;}
th{background:var(--accent3);color:#fff;padding:9px 10px;text-align:left;white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:#f5f0ea;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:0.75rem;font-weight:500;}
.badge.egg{background:#fff8e1;color:#f57f17;}
.badge.veg{background:#e8f5e9;color:#2e7d32;}
.badge.chicken{background:#ffebee;color:#b71c1c;}

/* ALERT */
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:0.88rem;}
.alert-success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;}
.alert-info{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9;}

/* REPORT PRINT AREA */
.report-header{text-align:center;margin-bottom:20px;}
.report-header h2{font-size:1.4rem;color:var(--accent3);}
.report-header p{font-size:0.85rem;color:var(--muted);}
.report-summary-table{width:100%;border-collapse:collapse;margin-top:16px;}
.report-summary-table th{background:var(--accent3);color:#fff;padding:8px 12px;}
.report-summary-table td{padding:8px 12px;border:1px solid var(--border);}
.report-summary-table tr.subtotal td{background:#f0f4ff;font-weight:600;}
.report-summary-table tr.grand td{background:var(--accent3);color:#fff;font-weight:700;}

/* COMPANY PILLS */
.company-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{padding:6px 16px;border-radius:20px;border:2px solid var(--border);cursor:pointer;font-size:0.83rem;background:#fff;transition:all 0.2s;}
.pill.active{border-color:var(--accent3);background:var(--accent3);color:#fff;}

@media print {
  nav,.no-print{display:none!important;}
  .page{display:block!important;}
  #page-report .card{box-shadow:none;border:none;}
}
</style>
</head>
<body>

<nav>
  <div>
    <div class="brand">Sri Karthikeya Deluxe Mess</div>
    <div class="sub">Somajiguda, Hyderabad — 500082 &nbsp;|&nbsp; PH: 9246193456</div>
  </div>
  <button onclick="showPage('dashboard')" id="nav-dashboard">Dashboard</button>
  <button onclick="showPage('entry')" id="nav-entry">Daily Entry</button>
  <button onclick="showPage('report')" id="nav-report">Monthly Report</button>
  <button onclick="showPage('companies')" id="nav-companies">Companies</button>
</nav>

<!-- ========== DASHBOARD ========== -->
<div class="page active" id="page-dashboard">
<div class="container">
  <h2 class="section-title" style="margin-top:8px">Today's Summary — <span id="dash-date"></span></h2>
  <div id="dash-alert"></div>
  <div class="grid4" id="dash-stats"></div>
  <div style="height:20px"></div>
  <h3 class="section-title">Today's Entries</h3>
  <div class="card tbl-wrap">
    <table>
      <thead><tr><th>Company</th><th>Meal Type</th><th>Plates</th><th>Amount (₹)</th></tr></thead>
      <tbody id="dash-table"></tbody>
    </table>
  </div>
</div>
</div>

<!-- ========== DAILY ENTRY ========== -->
<div class="page" id="page-entry">
<div class="container">
  <h2 class="section-title" style="margin-top:8px">Daily Meal Entry</h2>
  <div class="card" style="margin-bottom:16px">
    <div class="grid2" style="gap:12px;align-items:end">
      <div><label>Select Date</label><input type="date" id="entry-date"/></div>
      <div><button class="btn btn-primary" onclick="loadEntryForm()">Load</button></div>
    </div>
  </div>
  <div id="entry-form-area"></div>
</div>
</div>

<!-- ========== MONTHLY REPORT ========== -->
<div class="page" id="page-report">
<div class="container">
  <h2 class="section-title" style="margin-top:8px">Monthly Bill Report</h2>
  <div class="card no-print" style="margin-bottom:16px">
    <div class="grid2" style="gap:12px;align-items:end">
      <div>
        <label>Month & Year</label>
        <input type="month" id="report-month"/>
      </div>
      <div>
        <label>Company</label>
        <select id="report-company"></select>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
      <button class="btn btn-print" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  </div>
  <div id="report-output"></div>
</div>
</div>

<!-- ========== COMPANIES ========== -->
<div class="page" id="page-companies">
<div class="container">
  <h2 class="section-title" style="margin-top:8px">Manage Companies</h2>
  <div class="card" style="margin-bottom:16px">
    <h3 style="font-size:0.95rem;margin-bottom:12px;color:var(--accent3)">Add New Company</h3>
    <div class="grid2" style="gap:12px">
      <div><label>Company Name</label><input type="text" id="co-name" placeholder="e.g. XYZ Pvt. Ltd."/></div>
      <div><label>Default Plates/Day</label><input type="number" id="co-plates" min="1" value="10"/></div>
    </div>
    <div style="margin-top:12px"><button class="btn btn-primary" onclick="addCompany()">Add Company</button></div>
  </div>
  <div class="card">
    <h3 class="section-title">Current Companies</h3>
    <div id="co-list"></div>
  </div>
</div>
</div>

<script>
// ============================================================
// DATA MODEL
// ============================================================
const MEAL_TYPES = {
  egg:     { label:'Egg Meals',     rate:120, badge:'egg'     },
  veg:     { label:'Veg Meals',     rate:120, badge:'veg'     },
  chicken: { label:'Chicken Meals', rate:160, badge:'chicken' },
};

function getMealTypeForDate(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay(); // 0=Sun,1=Mon,...6=Sat
  if (day === 0 || day === 6) return null; // weekend
  if (day === 1) return 'egg';             // Monday
  if (day === 2 || day === 4) return 'veg';// Tue, Thu
  if (day === 3 || day === 5) return 'chicken'; // Wed, Fri
  return null;
}

const DEFAULT_COMPANIES = [
  {id:'c1', name:'Everest Infra Ventures India Pvt. Ltd.', defaultPlates:33},
  {id:'c2', name:'MediJourn Solutions Pvt. Ltd.',          defaultPlates:17},
  {id:'c3', name:'Wadi Surgicals Pvt. Ltd.',               defaultPlates:12},
  {id:'c4', name:'Fristor Foods Pvt. Ltd.',                defaultPlates:9},
];

function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function getCompanies() { return load('companies', DEFAULT_COMPANIES); }
function saveCompanies(c) { save('companies', c); }
// entries: { "YYYY-MM-DD": { companyId: { plates, mealType } } }
function getEntries() { return load('entries', {}); }
function saveEntries(e) { save('entries', e); }

// ============================================================
// NAVIGATION
// ============================================================
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name==='dashboard') renderDashboard();
  if (name==='companies') renderCompanies();
  if (name==='report') initReport();
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const today = todayStr();
  document.getElementById('dash-date').textContent = formatDate(today);
  const mealType = getMealTypeForDate(today);
  const entries = getEntries();
  const todayEntries = entries[today] || {};
  const companies = getCompanies();

  // stats
  let totalPlates=0, totalAmt=0, typeCount={egg:0,veg:0,chicken:0};
  companies.forEach(co => {
    const e = todayEntries[co.id];
    if (e) {
      totalPlates += e.plates;
      const rate = MEAL_TYPES[e.mealType].rate;
      totalAmt += e.plates * rate;
      typeCount[e.mealType] = (typeCount[e.mealType]||0) + e.plates;
    }
  });

  const alert = document.getElementById('dash-alert');
  if (!mealType) {
    alert.innerHTML = '<div class="alert alert-info">Today is a weekend — no meals scheduled.</div>';
  } else {
    const mt = MEAL_TYPES[mealType];
    alert.innerHTML = `<div class="alert alert-success">Today's meal type: <strong>${mt.label}</strong> @ ₹${mt.rate}/plate</div>`;
  }

  document.getElementById('dash-stats').innerHTML = `
    <div class="card stat egg"><div class="num">${typeCount.egg||0}</div><div class="lbl">Egg Plates</div></div>
    <div class="card stat veg"><div class="num">${typeCount.veg||0}</div><div class="lbl">Veg Plates</div></div>
    <div class="card stat chicken"><div class="num">${typeCount.chicken||0}</div><div class="lbl">Chicken Plates</div></div>
    <div class="card stat total"><div class="num">${totalPlates}</div><div class="lbl">Total Plates</div></div>
    <div class="card stat total" style="grid-column:span 2 / span 2;"><div class="num" style="font-size:1.6rem">₹${totalAmt.toLocaleString('en-IN')}</div><div class="lbl">Today's Total Amount</div></div>
  `;

  const tbody = document.getElementById('dash-table');
  if (!mealType) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted)">Weekend — no entries</td></tr>'; return; }
  tbody.innerHTML = companies.map(co => {
    const e = todayEntries[co.id];
    const plates = e ? e.plates : '—';
    const mt = e ? MEAL_TYPES[e.mealType] : null;
    const amt = e ? (e.plates * MEAL_TYPES[e.mealType].rate).toLocaleString('en-IN') : '—';
    return `<tr>
      <td>${co.name}</td>
      <td>${mt ? `<span class="badge ${mt.badge}">${mt.label}</span>` : '—'}</td>
      <td>${plates}</td>
      <td>₹${amt}</td>
    </tr>`;
  }).join('');
}

// ============================================================
// DAILY ENTRY
// ============================================================
function todayStr() {
  const d = new Date();
  return d.toISOString().split('T')[0];
}
function formatDate(str) {
  return new Date(str).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

document.getElementById('entry-date').value = todayStr();

function loadEntryForm() {
  const dateStr = document.getElementById('entry-date').value;
  if (!dateStr) return;
  const mealType = getMealTypeForDate(dateStr);
  const companies = getCompanies();
  const entries = getEntries();
  const dayEntries = entries[dateStr] || {};
  const area = document.getElementById('entry-form-area');

  if (!mealType) {
    area.innerHTML = '<div class="alert alert-info">This is a weekend — no meals on Saturdays and Sundays.</div>';
    return;
  }

  const mt = MEAL_TYPES[mealType];
  area.innerHTML = `
    <div class="alert alert-success" style="margin-bottom:12px">
      <strong>${formatDate(dateStr)}</strong> — ${mt.label} @ ₹${mt.rate}/plate
    </div>
    <div class="card">
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr>
          <th style="background:var(--accent3);color:#fff;padding:9px 12px;text-align:left">Company</th>
          <th style="background:var(--accent3);color:#fff;padding:9px 12px;text-align:left">Default</th>
          <th style="background:var(--accent3);color:#fff;padding:9px 12px;text-align:left">Plates Today</th>
          <th style="background:var(--accent3);color:#fff;padding:9px 12px;text-align:left">Amount</th>
        </tr></thead>
        <tbody>
        ${companies.map(co => {
          const saved = dayEntries[co.id];
          const plates = saved ? saved.plates : co.defaultPlates;
          return `<tr>
            <td style="padding:8px 12px;border-bottom:1px solid var(--border)">${co.name}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--border);color:var(--muted)">${co.defaultPlates}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--border)">
              <input type="number" min="0" value="${plates}" id="inp-${co.id}" style="width:80px" onchange="calcEntryRow('${co.id}','${mealType}')"/>
            </td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--border)" id="amt-${co.id}">₹${(plates*mt.rate).toLocaleString('en-IN')}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="saveEntry('${dateStr}','${mealType}')">💾 Save Entry</button>
        <button class="btn btn-danger" onclick="deleteEntry('${dateStr}')">🗑 Delete Entry</button>
      </div>
    </div>
  `;
}

function calcEntryRow(coId, mealType) {
  const val = parseInt(document.getElementById('inp-'+coId).value)||0;
  const rate = MEAL_TYPES[mealType].rate;
  document.getElementById('amt-'+coId).textContent = '₹'+(val*rate).toLocaleString('en-IN');
}

function saveEntry(dateStr, mealType) {
  const companies = getCompanies();
  const entries = getEntries();
  if (!entries[dateStr]) entries[dateStr] = {};
  companies.forEach(co => {
    const el = document.getElementById('inp-'+co.id);
    if (el) {
      const plates = parseInt(el.value)||0;
      entries[dateStr][co.id] = { plates, mealType };
    }
  });
  saveEntries(entries);
  showToast('Entry saved for '+formatDate(dateStr));
}

function deleteEntry(dateStr) {
  if (!confirm('Delete all entries for '+formatDate(dateStr)+'?')) return;
  const entries = getEntries();
  delete entries[dateStr];
  saveEntries(entries);
  document.getElementById('entry-form-area').innerHTML = '<div class="alert alert-info">Entry deleted.</div>';
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className='alert alert-success no-print';
  t.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;min-width:240px;box-shadow:0 4px 20px rgba(0,0,0,0.15)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// ============================================================
// MONTHLY REPORT (Matching your PDF format)
// ============================================================
function initReport() {
  const companies = getCompanies();
  const sel = document.getElementById('report-company');
  sel.innerHTML = '<option value="ALL">All Companies</option>' + companies.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  // default to current month
  const now = new Date();
  const m = String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('report-month').value = `${now.getFullYear()}-${m}`;
}

function generateReport() {
  const monthVal = document.getElementById('report-month').value;
  const companyId = document.getElementById('report-company').value;
  if (!monthVal) return;

  const [year, month] = monthVal.split('-').map(Number);
  const companies = getCompanies();
  const entries = getEntries();
  const targetCos = companyId === 'ALL' ? companies : companies.filter(c=>c.id===companyId);

  // gather all working days of the month
  const daysInMonth = new Date(year, month, 0).getDate();
  const workingDays = [];
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const mt = getMealTypeForDate(dateStr);
    if (mt) workingDays.push({date:d, dateStr, mealType:mt});
  }

  const monthLabel = new Date(year,month-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});

  let html = '';

  targetCos.forEach(co => {
    // group days by meal type, only days that have entries (or use default)
    const groups = { egg:[], veg:[], chicken:[] };
    let hasAnyEntry = false;
    workingDays.forEach(({date, dateStr, mealType}) => {
      const e = entries[dateStr]?.[co.id];
      if (e && e.plates > 0) {
        groups[mealType].push({date, plates: e.plates});
        hasAnyEntry = true;
      }
    });

    // Build report table rows
    let rows = '';
    let grandTotal = 0;
    let slNo = 1;

    const typeOrder = ['egg','veg','chicken'];
    const typeLabels = { egg:'Egg Meals', veg:'Veg Meals (Tue & Thu)', chicken:'Chicken Meals (Wed & Fri)' };

    typeOrder.forEach(mt => {
      const days = groups[mt];
      if (days.length === 0) return;

      // group by unique plate counts
      // but since it can vary per day, we show each group together by rate
      // per PDF: show day numbers, persons/day, days, total meals, rate, amount
      // group consecutive same-plate entries
      const plateGroups = {};
      days.forEach(({date, plates}) => {
        if (!plateGroups[plates]) plateGroups[plates] = [];
        plateGroups[plates].push(date);
      });

      Object.entries(plateGroups).forEach(([plates, dayNums]) => {
        const platesNum = parseInt(plates);
        const totalMeals = platesNum * dayNums.length;
        const rate = MEAL_TYPES[mt].rate;
        const amount = totalMeals * rate;
        grandTotal += amount;
        rows += `<tr>
          <td style="padding:8px 12px;border:1px solid var(--border)">${slNo++}</td>
          <td style="padding:8px 12px;border:1px solid var(--border)">${typeLabels[mt]}</td>
          <td style="padding:8px 12px;border:1px solid var(--border)">${dayNums.join(', ')}</td>
          <td style="padding:8px 12px;border:1px solid var(--border);text-align:center">${platesNum}</td>
          <td style="padding:8px 12px;border:1px solid var(--border);text-align:center">${dayNums.length}</td>
          <td style="padding:8px 12px;border:1px solid var(--border);text-align:center">${totalMeals}</td>
          <td style="padding:8px 12px;border:1px solid var(--border);text-align:center">₹${rate}</td>
          <td style="padding:8px 12px;border:1px solid var(--border);text-align:right;font-weight:600">₹${amount.toLocaleString('en-IN')}</td>
        </tr>`;
      });
    });

    if (!hasAnyEntry) {
      rows = `<tr><td colspan="8" style="padding:12px;text-align:center;color:var(--muted);border:1px solid var(--border)">No entries recorded for this month</td></tr>`;
    }

    html += `
    <div class="card" style="margin-bottom:24px;page-break-after:always;">
      <div class="report-header">
        <div style="font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Sri Karthikeya Deluxe Mess</div>
        <h2 style="font-family:'Playfair Display',serif;color:var(--accent3);font-size:1.3rem;margin:4px 0">${monthLabel.toUpperCase()} — BILL</h2>
        <div style="font-size:1rem;font-weight:600;margin-top:2px">${co.name}</div>
      </div>
      <div class="tbl-wrap">
        <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
          <thead>
            <tr>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;">Sl.</th>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;">Description</th>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;">Day Numbers</th>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;text-align:center">Persons/Day</th>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;text-align:center">Days</th>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;text-align:center">Total Meals</th>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;text-align:center">Rate (₹)</th>
              <th style="padding:9px 12px;background:var(--accent3);color:#fff;text-align:right">Amount (₹)</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr>
              <td colspan="7" style="padding:10px 12px;font-weight:700;text-align:right;background:#f0f4ff;border:1px solid var(--border)">TOTAL</td>
              <td style="padding:10px 12px;font-weight:700;text-align:right;background:var(--accent3);color:#fff;border:1px solid var(--border);font-size:1rem">₹${grandTotal.toLocaleString('en-IN')}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div style="margin-top:14px;font-size:0.8rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;">
        Somajiguda, Hyderabad — 500082 &nbsp;|&nbsp; PH: 9246193456
      </div>
    </div>`;
  });

  document.getElementById('report-output').innerHTML = html || '<div class="alert alert-info">No data to show. Please add daily entries first.</div>';
}

// ============================================================
// COMPANY MANAGEMENT
// ============================================================
function renderCompanies() {
  const companies = getCompanies();
  document.getElementById('co-list').innerHTML = `
    <div class="tbl-wrap"><table>
      <thead><tr><th>Company Name</th><th>Default Plates/Day</th><th>Actions</th></tr></thead>
      <tbody>
        ${companies.map(co=>`<tr>
          <td>${co.name}</td>
          <td><input type="number" value="${co.defaultPlates}" min="1" id="dp-${co.id}" style="width:70px" onchange="updateDefault('${co.id}')"/></td>
          <td><button class="btn btn-danger btn-sm" onclick="deleteCompany('${co.id}')">Delete</button></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

function updateDefault(id) {
  const companies = getCompanies();
  const co = companies.find(c=>c.id===id);
  if (co) {
    const val = parseInt(document.getElementById('dp-'+id).value)||1;
    co.defaultPlates = val;
    saveCompanies(companies);
    showToast('Updated default for '+co.name);
  }
}

function addCompany() {
  const name = document.getElementById('co-name').value.trim();
  const plates = parseInt(document.getElementById('co-plates').value)||10;
  if (!name) return alert('Please enter a company name.');
  const companies = getCompanies();
  companies.push({id:'c'+Date.now(), name, defaultPlates: plates});
  saveCompanies(companies);
  document.getElementById('co-name').value='';
  document.getElementById('co-plates').value='10';
  renderCompanies();
  showToast('Company added!');
}

function deleteCompany(id) {
  if (!confirm('Delete this company?')) return;
  const companies = getCompanies().filter(c=>c.id!==id);
  saveCompanies(companies);
  renderCompanies();
}

// INIT
// ============================================================
showPage('dashboard');
</script>
